resolver 127.0.0.11 valid=10s ipv6=off;
upstream doubo_api {
  zone api_pool 64k;
  server api:5173 resolve;
  keepalive 32;
}
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 51m;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  # 素材上传（视频最大 500 MB）、一键复刻截取参考片段（先下载原视频）和后台「上传作品」：
  # 边收边转给 API，等它把视频传完 OSS。
  # 正则 location 按顺序匹配，须放在通用 /api 规则之前。
  location ~ ^/api/(assets(/[^/]+/reference-clip)?|admin/works)$ {
    proxy_pass http://doubo_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 510m;
    client_body_timeout 300s;
    proxy_request_buffering off;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
  }
  location /api/ {
    proxy_pass http://doubo_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 95s;
  }
  location /media/ {
    proxy_pass http://doubo_api;
    proxy_set_header Host $http_host;
  }
  location /s/ { proxy_pass http://doubo_api; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
  location /health/ { proxy_pass http://doubo_api; }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
